[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honeypot-auditor"
version = "0.6.0"
description = "Multi-protocol CLI that fingerprints whether an authorized target behaves like a low-interaction honeypot."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Moran Zavdi", email = "security@helloaeterna.com" }]
keywords = ["honeypot", "security", "fingerprinting", "purple-team", "deception"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "rich>=13.0",
  "rich-argparse>=1.5",
  "pyfiglet>=1.0",
  "paramiko>=3.0",
  "requests>=2.31",
]

[project.optional-dependencies]
full = [
  "python-nmap>=0.7.1",
  "impacket>=0.11",
  "telnetlib3>=2.0",
  "redis>=5.0",
  "shodan>=1.31",
  "scapy>=2.5",
  "PySocks>=1.7.1",
  "pyyaml>=6.0",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "build>=1.0",
]
security = [
  "bandit>=1.9",
  "detect-secrets>=1.5",
  "pip-audit>=2.10",
  "semgrep>=1.176",
]

[project.scripts]
honeypot-auditor = "honeypot_auditor.cli:main"

[project.entry-points."honeypot_auditor.plugins"]
# Community plugins register via: mypkg = "mypkg:register"

[project.entry-points."honeypot_auditor.intel"]
# Passive-intel plugins expose one callable: provider(ip, api_key) -> list[Indicator]

[project.urls]
Homepage = "https://github.com/mziqudhd92/honeypot-auditor"
Documentation = "https://github.com/mziqudhd92/honeypot-auditor#readme"
Repository = "https://github.com/mziqudhd92/honeypot-auditor"
Issues = "https://github.com/mziqudhd92/honeypot-auditor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
honeypot_auditor = [
  "data/*.json",
  "signatures/core/*.json",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["honeypot_auditor"]
source_pkgs = ["honeypot_auditor"]
omit = [
  "*/tests/*",
  "*/test_*.py",
]

[tool.coverage.paths]
source = [
  "src/honeypot_auditor",
  "*/site-packages/honeypot_auditor",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]
fail_under = 60
precision = 2
show_missing = true
skip_covered = false
skip_empty = true

[tool.coverage.html]
show_contexts = true
title = "honeypot-auditor coverage"

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-q",
  "--strict-markers",
  "--cov=honeypot_auditor",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml:coverage.xml",
  "--cov-report=html:htmlcov",
]
markers = [
  "integration: live network or Docker targets (not run in default CI unit job)",
  "replay: offline socket replay harness (no network)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
files = ["src/honeypot_auditor"]
ignore_missing_imports = true
python_version = "3.10"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
targets = ["src", "scripts", "honeypot-auditor.py"]
