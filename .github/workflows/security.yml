name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install security toolchain
        run: pip install -e ".[security]"
      - name: Semgrep
        run: semgrep scan --config p/python --config p/security-audit --config p/secrets --error --metrics off .
      - name: Bandit
        run: bandit -c pyproject.toml -r src scripts honeypot-auditor.py
      - name: Dependency vulnerabilities
        run: pip-audit
      - name: Secret candidates
        shell: bash
        run: |
          detect-secrets scan > /tmp/detect-secrets.json
          python - <<'PY'
          import json

          with open("/tmp/detect-secrets.json", encoding="utf-8") as stream:
              results = json.load(stream)["results"]
          if any(results.values()):
              raise SystemExit(f"unreviewed secret candidates: {results}")
          PY

  history-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
