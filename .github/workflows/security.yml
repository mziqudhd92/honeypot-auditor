name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly pass so new CVEs / secrets in the tree surface between PRs
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      # Audit the product deps first. Semgrep currently pins PyJWT<2.14 (CVE stream
      # in pip-audit); install it only after the audit so CI is not blocked on a
      # toolchain pin outside this project's dependency tree.
      - name: Install project and audit toolchain
        run: |
          pip install -e ".[full,dev]"
          pip install "bandit>=1.9" "detect-secrets>=1.5" "pip-audit>=2.10"
      - name: Dependency vulnerabilities
        run: pip-audit
      - name: Install Semgrep
        run: pip install "semgrep>=1.176"
      - name: Semgrep
        run: semgrep scan --config p/python --config p/security-audit --config p/secrets --error --metrics off .
      - name: Bandit
        run: bandit -c pyproject.toml -r src honeypot-auditor.py
      - name: Secret candidates
        shell: bash
        run: |
          detect-secrets scan --exclude-files 'tests/fixtures/.*' > /tmp/detect-secrets.json
          python - <<'PY'
          import json

          with open("/tmp/detect-secrets.json", encoding="utf-8") as stream:
              results = json.load(stream)["results"]
          if any(results.values()):
              raise SystemExit(f"unreviewed secret candidates: {results}")
          PY

  history-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
