name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly pass so new CVEs / secrets in the tree surface between PRs
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      # Audit the product deps first. Semgrep currently pins PyJWT<2.14 (CVE stream
      # in pip-audit); install it only after the audit so CI is not blocked on a
      # toolchain pin outside this project's dependency tree.
      - name: Install project and audit toolchain
        run: |
          uv sync --frozen --extra full --extra dev
          uv pip install "bandit>=1.9" "detect-secrets>=1.5" "pip-audit>=2.10"
      - name: Dependency vulnerabilities
        run: uv run pip-audit
      - name: Install Semgrep
        run: uv pip install "semgrep>=1.176"
      - name: Semgrep
        run: uv run semgrep scan --config p/python --config p/security-audit --config p/secrets --error --metrics off .
      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src honeypot-auditor.py
      - name: Secret candidates
        shell: bash
        run: |
          # Only TLS fingerprint corpora (hex JA3S/JA4S) — keep scanning the rest of data/.
          uv run detect-secrets scan \
            --exclude-files 'tests/fixtures/.*' \
            --exclude-files 'src/honeypot_auditor/data/tls_profiles\.json' \
            --exclude-files 'src/honeypot_auditor/data/cdn_tls_profiles\.json' \
            > /tmp/detect-secrets.json
          python - <<'PY'
          import json

          with open("/tmp/detect-secrets.json", encoding="utf-8") as stream:
              results = json.load(stream)["results"]
          if any(results.values()):
              raise SystemExit(f"unreviewed secret candidates: {results}")
          PY

  history-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
