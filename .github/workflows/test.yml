name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[full,dev]"
      - name: Unit tests (no coverage)
        run: pytest --no-cov -m "not integration"
      - name: Ruff
        run: ruff check src tests
      - name: Build package
        if: matrix.python-version == '3.12'
        run: python -m build

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[full,dev]"
      - name: Pytest with coverage gate
        run: pytest --cov-fail-under=60 -m "not integration"
      - name: Type check
        run: mypy src/honeypot_auditor
      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[full,dev]"
      - name: Unit tests
        run: python -m pytest --no-cov -m "not integration"
      - name: Ruff
        run: ruff check src tests scripts honeypot-auditor.py
      - name: Package build
        run: python -m build

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[full,dev]"
      - name: Start Cowrie benchmark container
        run: |
          docker compose -f deploy/docker-compose.benchmark.yml up -d cowrie
          sleep 15
      - name: Audit Cowrie (expect honeypot)
        run: |
          honeypot-auditor --target 127.0.0.1 \
            --preset iana --ports ssh=8022,telnet=8023 \
            --deep --timeout 8 \
            --output /tmp/cowrie-integration.json
          python - <<'PY'
          import json, sys
          r = json.load(open("/tmp/cowrie-integration.json"))
          assert r["score"] >= 30, r
          assert "Honeypot" in r["threat_level"], r
          print("integration ok:", r["score"], r["threat_level"])
          PY
