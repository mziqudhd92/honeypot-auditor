name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra full --extra dev
      - name: Unit tests (no coverage)
        run: uv run pytest --no-cov -m "not integration"
      - name: Ruff
        run: uv run ruff check src tests
      - name: Build package
        if: matrix.python-version == '3.12'
        run: uv run python -m build

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra full --extra dev
      - name: Pytest with coverage gate
        # Must match [tool.coverage.report] fail_under in pyproject.toml and the
        # Makefile test-cov gate — keep all three in sync.
        run: uv run pytest --cov-fail-under=80 -m "not integration"
      - name: Type check
        run: uv run mypy src/honeypot_auditor
      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra full --extra dev
      - name: Unit tests
        run: uv run pytest --no-cov -m "not integration"
      - name: Ruff
        run: uv run ruff check src tests honeypot-auditor.py
      - name: Package build
        run: uv run python -m build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra full --extra dev
      - name: Start Cowrie benchmark container
        run: |
          docker compose -f tests/fixtures/benchmark/docker-compose.yml up -d cowrie
          sleep 15
      - name: Audit Cowrie (expect honeypot)
        run: |
          uv run honeypot-auditor --target 127.0.0.1 \
            --preset iana --ports ssh=8022,telnet=8023 \
            --deep --timeout 8 \
            --output /tmp/cowrie-integration.json
          python - <<'PY'
          import json, sys
          r = json.load(open("/tmp/cowrie-integration.json"))
          assert r["score"] >= 30, r
          assert "Honeypot" in r["threat_level"], r
          print("integration ok:", r["score"], r["threat_level"])
          PY
