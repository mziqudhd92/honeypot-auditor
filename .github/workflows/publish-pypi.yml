name: Publish PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run python -m build
      - name: Verify package data in wheel
        run: |
          uv run python - <<'PY'
          import zipfile
          from pathlib import Path
          wheels = list(Path("dist").glob("honeypot_auditor-*.whl"))
          assert wheels, "no wheel built"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          assert any(n.endswith("signatures/core/ftp_desert.json") for n in names), names
          assert any(n.endswith("data/tls_profiles.json") for n in names), names
          assert any(n.endswith("data/http2_settings_profiles.json") for n in names), names
          print("wheel package-data ok")
          PY
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
