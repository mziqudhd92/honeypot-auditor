name: Publish PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Verify package data in wheel
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          wheels = list(Path("dist").glob("honeypot_auditor-*.whl"))
          assert wheels, "no wheel built"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          assert any(n.endswith("signatures/core/ftp_desert.json") for n in names), names
          assert any(n.endswith("data/tls_profiles.json") for n in names), names
          assert any(n.endswith("data/http2_settings_profiles.json") for n in names), names
          print("wheel package-data ok")
          PY
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
