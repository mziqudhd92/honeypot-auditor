name: Golden fixtures

on:
  push:
    branches: [main]
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install actionlint (checksum-verified)
        run: |
          set -euo pipefail
          VER=1.7.7
          ARCHIVE="actionlint_${VER}_linux_amd64.tar.gz"
          EXPECTED_SHA256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          BASE="https://github.com/rhysd/actionlint/releases/download/v${VER}"
          curl -fsSL "${BASE}/${ARCHIVE}" -o "${ARCHIVE}"
          curl -fsSL "${BASE}/actionlint_${VER}_checksums.txt" -o checksums.txt
          echo "${EXPECTED_SHA256}  ${ARCHIVE}" | sha256sum -c -
          grep -F "${ARCHIVE}" checksums.txt | sha256sum -c -
          tar -xzf "${ARCHIVE}" actionlint
          ./actionlint -version
      - name: Lint workflows and composite action
        run: ./actionlint -color

  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,full]"
      - run: pytest tests/ -q --no-cov -m replay

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,full]"
      - run: ruff check src tests
      - run: pytest tests/ -q --no-cov -m "not integration"
      - run: bash scripts/sync-public-docs.sh
      - name: Wheel package-data smoke
        run: |
          python -m build -w -o /tmp/hpa-wheel
          pip install --force-reinstall /tmp/hpa-wheel/honeypot_auditor-*.whl
          python - <<'PY'
          from honeypot_auditor.signatures.loader import load_core_pack
          from honeypot_auditor.tls_fingerprint import load_tls_profiles
          from honeypot_auditor.http2_fingerprint import load_http2_profiles
          pack = load_core_pack()
          assert len(pack.rules) >= 2, pack.rules
          tls = load_tls_profiles()
          assert "lures" in tls
          assert "cdn_edge" in tls and "cloudflare" in tls["cdn_edge"]
          h2 = load_http2_profiles()
          assert h2.get("lures"), h2
          print("package-data ok", len(pack.rules), "rules")
          PY

  docker-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,full]"
      - name: Start benchmark lab
        run: docker compose -f deploy/docker-compose.benchmark.yml up -d
      - name: Wait for ports
        run: |
          for i in $(seq 1 60); do
            (echo >/dev/tcp/127.0.0.1/8022) 2>/dev/null && \
            (echo >/dev/tcp/127.0.0.1/8088) 2>/dev/null && break
            sleep 2
          done
      - name: Golden integration asserts
        run: pytest tests/integration/test_golden.py -q --no-cov -m integration
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.benchmark.yml down -v
