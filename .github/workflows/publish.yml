name: publish

# Release-page workflow: test only.
# PyPI uploads are owned exclusively by publish-pypi.yml (tag push v*),
# which matches the project's trusted publisher on pypi.org.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install and test
        run: |
          uv sync --frozen --extra full --extra dev
          uv run pytest --cov-fail-under=75
          uv run ruff check src tests
      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$PKG" || { echo "Tag v$TAG != pyproject version $PKG"; exit 1; }

  sbom:
    # Attach a CycloneDX SBOM of the released package + dependency tree to the
    # GitHub Release (PyPI side gets PEP 740 attestations via Trusted Publishing).
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install released package and CycloneDX generator
        run: |
          uv sync --frozen --extra full
          uv pip install "cyclonedx-bom>=7"
      - name: Generate CycloneDX SBOM
        run: |
          uv run cyclonedx-py environment \
            --pyproject pyproject.toml \
            --of JSON \
            --sv 1.5 \
            -o sbom.cdx.json
      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" sbom.cdx.json --clobber --repo "${{ github.repository }}"
