# Production-like Host validation for http.wildcard_host.
# Serve a real document root (do not `return 200` — that skips body reads and
# falsely trips malformed_200 / chunked_premature / POST state checks).
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name invalid.test.local;
    return 444;
}
