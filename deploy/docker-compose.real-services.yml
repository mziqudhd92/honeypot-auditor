# Real-service baseline lab — should score as Likely Real Host, not a honeypot.
#
# Usage:
#   docker compose -f deploy/docker-compose.real-services.yml up -d
#   ./scripts/real-services-lab.sh
#
# Binds 127.0.0.1 only. Remaps ports that collide with other local stacks.

name: honeypot-auditor-real

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: hpaudit-real-nginx
    ports:
      - "127.0.0.1:8081:80/tcp"
    volumes:
      - ./real-services/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: hpaudit-real-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379/tcp"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: hpaudit-real-postgres
    environment:
      POSTGRES_PASSWORD: hpaudit_lab
      POSTGRES_USER: hpaudit
      POSTGRES_DB: hpaudit
    ports:
      - "127.0.0.1:15432:5432/tcp"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hpaudit"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: hpaudit-real-mysql
    environment:
      MYSQL_ROOT_PASSWORD: hpaudit_lab
      MYSQL_DATABASE: hpaudit
    ports:
      - "127.0.0.1:13306:3306/tcp"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-phpaudit_lab"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  memcached:
    image: memcached:1.6-alpine
    container_name: hpaudit-real-memcached
    command: ["memcached", "-m", "64", "-l", "0.0.0.0"]
    ports:
      - "127.0.0.1:21211:11211/tcp"
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: hpaudit-real-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m
      cluster.name: hpaudit-real
      bootstrap.memory_lock: "false"
    ports:
      - "127.0.0.1:19200:9200/tcp"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: hpaudit-real-mosquitto
    ports:
      - "127.0.0.1:11883:1883/tcp"
    volumes:
      - ./real-services/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  coredns:
    image: coredns/coredns:1.11.3
    container_name: hpaudit-real-coredns
    command: ["-conf", "/etc/coredns/Corefile"]
    ports:
      - "127.0.0.1:15353:53/udp"
      - "127.0.0.1:15353:53/tcp"
    volumes:
      - ./real-services/Corefile:/etc/coredns/Corefile:ro
    restart: unless-stopped

  chrony:
    image: cturra/ntp:latest
    container_name: hpaudit-real-chrony
    ports:
      - "127.0.0.1:1123:123/udp"
    environment:
      NTP_SERVERS: "time.cloudflare.com"
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: hpaudit-real-mongo
    ports:
      - "127.0.0.1:27017:27017/tcp"
    command: ["mongod", "--bind_ip_all", "--quiet"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  openssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: hpaudit-real-openssh
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      PASSWORD_ACCESS: "true"
      USER_NAME: hpaudit
      USER_PASSWORD: hpaudit_lab
    ports:
      - "127.0.0.1:2223:2222/tcp"
    restart: unless-stopped

  squid:
    image: ubuntu/squid:latest
    container_name: hpaudit-real-squid
    ports:
      - "127.0.0.1:3128:3128/tcp"
    volumes:
      - ./real-services/squid.conf:/etc/squid/squid.conf:ro
    restart: unless-stopped

  samba:
    image: dperson/samba:latest
    container_name: hpaudit-real-samba
    environment:
      USER: "hpaudit;hpaudit_lab"
      SHARE: "public;/share;yes;no;yes;all;none"
    ports:
      - "127.0.0.1:1445:445/tcp"
    tmpfs:
      - /share
    restart: unless-stopped

  vsftpd:
    build:
      context: ./real-services
      dockerfile: Dockerfile.ftp
    image: hpaudit-real-ftp:local
    container_name: hpaudit-real-vsftpd
    ports:
      - "127.0.0.1:12121:21/tcp"
      - "127.0.0.1:21100-21110:21100-21110/tcp"
    restart: unless-stopped

  telnet:
    build:
      context: ./real-services
      dockerfile: Dockerfile.telnet
    image: hpaudit-real-telnet:local
    container_name: hpaudit-real-telnet
    ports:
      - "127.0.0.1:2324:23/tcp"
    restart: unless-stopped

  tftpd:
    build:
      context: ./real-services
      dockerfile: Dockerfile.tftp
    image: hpaudit-real-tftp:local
    container_name: hpaudit-real-tftp
    ports:
      - "127.0.0.1:1069:69/udp"
    restart: unless-stopped

  dovecot:
    build:
      context: ./real-services
      dockerfile: Dockerfile.pop3
    image: hpaudit-real-pop3:local
    container_name: hpaudit-real-dovecot
    ports:
      - "127.0.0.1:1110:110/tcp"
    restart: unless-stopped

  postfix:
    image: boky/postfix:latest
    container_name: hpaudit-real-postfix
    environment:
      ALLOWED_SENDER_DOMAINS: hpaudit-real.test
      POSTFIX_myhostname: mail.hpaudit-real.test
      POSTFIX_mydomain: hpaudit-real.test
      POSTFIX_myorigin: mail.hpaudit-real.test
      # $$ escapes compose interpolation so Postfix sees $myhostname
      POSTFIX_smtpd_banner: "$$myhostname ESMTP"
      HOSTNAME: mail.hpaudit-real.test
    ports:
      - "127.0.0.1:2525:25/tcp"
    restart: unless-stopped
