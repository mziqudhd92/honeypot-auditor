# Clean baseline for golden CI — reject unknown Host (production-like default_server).
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;

    location / {
        default_type text/plain;
        return 200 "honeypot-auditor nginx baseline\n";
    }
}

server {
    listen 80;
    server_name invalid.test.local;
    return 444;
}
